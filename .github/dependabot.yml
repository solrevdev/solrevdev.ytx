version: 2
updates:
  # Actions are pinned to commit SHAs; Dependabot keeps the SHA and the version comment in step.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      test-dependencies:
        patterns: ["Microsoft.NET.Test.Sdk", "xunit*"]
