version: 2
updates:
  # Actions are pinned to commit SHAs; Dependabot keeps the SHA and the version comment in step.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The root has no project or solution file, so name the project folders.
  # `directory: /` finds nothing and Dependabot stays silent.
  - package-ecosystem: nuget
    directories:
      - /src/*
      - /tests/*
    schedule:
      interval: weekly
    groups:
      test-dependencies:
        patterns: ["Microsoft.NET.Test.Sdk", "xunit*"]
